<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in to the app | TeamCode</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/img/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/site.css">
</head>
<body data-page="app-login">
  <nav><div class="wrap">
    <a class="brand" href="/"><svg viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="5" fill="var(--ink)"/><path d="M7.5 6.5v11M12 6.5v6.5" stroke="var(--ink-text)" stroke-width="2.4" stroke-linecap="round"/><path d="M16.5 6.5v9" stroke="var(--signal)" stroke-width="2.4" stroke-linecap="round"/></svg>TeamCode</a>
    <div class="right" id="nav-account"><a href="/#download">Download</a><a href="/login">Sign in</a></div>
  </div></nav>
  <main>
    <section class="auth"><div class="card">
      <div><div class="label">Desktop app</div><h1>Sign in to TeamCode on this computer?</h1></div>
      <p>Check that the code below matches the one showing in the TeamCode app. If you didn't just click Sign in in the app, close this page.</p>
      <div class="code" id="user-code">XXXX-XXXX</div>
      <div class="msg" id="msg" role="alert"></div>
      <p class="alt" id="who"></p>
      <button class="btn primary block" id="approve" type="button" disabled>Approve and sign in</button>
    </div></section>
  </main>
  <footer><div class="wrap"><span class="grow">TeamCode</span><a href="/terms">Terms</a><a href="/privacy">Privacy</a></div></footer>
  <script src="/js/account.js"></script>
</body>
</html>
