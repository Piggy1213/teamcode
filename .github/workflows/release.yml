# Builds installers and publishes them to a GitHub release when a version tag is pushed:
#   git tag v1.0.1 && git push origin v1.0.1
# The website (website/) serves the latest release's installers.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build (e.g. v1.0.0)
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.TAG }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: npm test
      - name: Website tests (accounts, security, cloud workspaces)
        working-directory: website
        run: npm ci && npm test

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release (if it doesn't exist yet)
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "TeamCode ${TAG#v}" --generate-notes

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
            files: dist/*.exe
          - os: macos-latest
            args: --mac
            files: dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.TAG }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build installers
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload to the release
        shell: bash
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: gh release upload "$TAG" ${{ matrix.files }} --clobber
